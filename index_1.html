<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gedankenblasen</title>
<meta name="description" content="Zwei Minuten am Abend: Stimmung festhalten, Gedanken als Blasen sammeln und loslassen.">
<meta name="theme-color" content="#F1EEF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1727" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gedankenblasen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: eine ruhige Spalte wie ein Abendhimmel, unten eine Tab-Leiste mit vier Räumen */
:root {
  --bg: #F1EEF6;
  --bg-deep: #E6E0EF;
  --surface: #FCFBFE;
  --ink: #2A2638;
  --muted: #5E5770;
  --line: #DCD5E8;
  --accent: #6553A6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7E0F6;
  --danger: #A2384F;
  --bubble-ink: #2A2638;
  --shadow: 0 10px 30px rgba(70, 50, 120, .12);
  --m1: #A9C1EA; --m2: #CBB8EE; --m3: #BEDFC9; --m4: #F7CDB1; --m5: #F4E39B; --w3: #D9DCE6;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1727; --bg-deep: #14121F; --surface: #252136; --ink: #EEEAF6; --muted: #B6AFCA;
    --line: #3A3452; --accent: #BBAEF2; --accent-ink: #1A1727; --accent-soft: #332D4C;
    --danger: #F2A3B4; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --m1: #9DB5E0; --m2: #BFAAE6; --m3: #AFD3BA; --m4: #EDBF9F; --m5: #E9D88C; --w3: #B9BBCB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1727; --bg-deep: #14121F; --surface: #252136; --ink: #EEEAF6; --muted: #B6AFCA;
  --line: #3A3452; --accent: #BBAEF2; --accent-ink: #1A1727; --accent-soft: #332D4C;
  --danger: #F2A3B4; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --m1: #9DB5E0; --m2: #BFAAE6; --m3: #AFD3BA; --m4: #EDBF9F; --m5: #E9D88C; --w3: #B9BBCB;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-deep), var(--bg) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: .2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }

h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.view { display: flex; flex-direction: column; gap: 18px; }
.view[hidden] { display: none !important; }

.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
.note {
  display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft);
  border-radius: var(--r-md); padding: 14px 16px; font-size: .95rem;
}
.note p { margin: 0; }
.note .note-x { margin-left: auto; flex: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 700; }

/* Stimmung */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; padding: 0; margin-bottom: 12px; }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mood-opt { position: relative; }
.mood-opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.mood-opt label {
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 2px; border-radius: var(--r-md); border: 2px solid transparent; transition: background .2s, border-color .2s;
}
.mood-opt .dot {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  box-shadow: inset -4px -6px 10px rgba(0,0,0,.07); transition: transform .25s;
}
.mood-opt .dot svg { width: 34px; height: 34px; }
.mood-opt span.lbl { font-size: .8rem; color: var(--muted); text-align: center; line-height: 1.2; }
.mood-opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.mood-opt input:checked + label .dot { transform: scale(1.1); }
.mood-opt input:checked + label span.lbl { color: var(--ink); font-weight: 700; }
.mood-opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

.q { display: flex; flex-direction: column; gap: 6px; }
.q label { font-weight: 700; }
.q small { color: var(--muted); font-size: .85rem; }
textarea {
  width: 100%; min-height: 84px; resize: vertical; border-radius: var(--r-sm);
  border: 1.5px solid var(--line); background: var(--bg); padding: 12px 14px; line-height: 1.5;
}
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="date"] {
  border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg); padding: 8px 12px; max-width: 100%;
}
.form { display: flex; flex-direction: column; gap: 20px; }
.form-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }
details.when summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
details.when[open] summary { margin-bottom: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem;
  transition: transform .15s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Segment-Umschalter */
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; border: 1px solid var(--line); align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Blasenfeld */
.field {
  position: relative; width: 100%; border-radius: var(--r-lg); overflow: hidden;
  background: radial-gradient(90% 70% at 50% 100%, var(--accent-soft), transparent 70%), var(--surface);
  box-shadow: var(--shadow); min-height: 420px;
}
.bubble {
  position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); cursor: pointer; padding: 0;
  color: var(--bubble-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.9) 0 7%, rgba(255,255,255,0) 8%),
    radial-gradient(circle at 38% 32%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
    var(--c);
  box-shadow: inset -8px -10px 18px rgba(40,20,80,.10), 0 8px 18px rgba(60,40,100,.14);
  animation: float var(--dur, 8s) ease-in-out var(--delay, 0s) infinite alternate;
  transition: transform .2s;
}
.bubble:hover { filter: brightness(1.03); }
.bubble svg { width: 38%; height: 38%; }
.bubble .bd { font-size: .74rem; font-weight: 700; line-height: 1; }
.bubble.sample { opacity: .8; }
.bubble.sample .bd { font-weight: 400; font-style: italic; }
.bubble.fresh { animation: rise 1.6s cubic-bezier(.2,.8,.2,1) both, float var(--dur, 8s) ease-in-out 1.6s infinite alternate; }
@keyframes float {
  0% { transform: translate(0, 0); }
  50% { transform: translate(var(--dx, 4px), -10px); }
  100% { transform: translate(calc(var(--dx, 4px) * -1), -4px); }
}
@keyframes rise {
  0% { transform: translateY(180px) scale(.6); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.field-empty {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 18px; text-align: center;
  background: linear-gradient(transparent, var(--surface) 40%);
}
.field-empty p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
.field-more { color: var(--muted); font-size: .9rem; margin: 0; text-align: center; }

/* Liste */
.list { display: flex; flex-direction: column; gap: 20px; }
.list-month h3 { font-size: 1rem; color: var(--muted); margin-bottom: 8px; text-transform: none; }
.list-items { display: flex; flex-direction: column; gap: 8px; }
.entry-row {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; cursor: pointer;
}
.entry-row .chip { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--bubble-ink); }
.entry-row .chip svg { width: 26px; height: 26px; }
.entry-row .meta { min-width: 0; }
.entry-row .meta strong { display: block; font-size: .95rem; }
.entry-row .meta span { display: block; color: var(--muted); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }

/* Loslassen */
.release-stage { position: relative; display: grid; place-items: center; min-height: 340px; }
.release-bubble {
  width: min(78vw, 290px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid rgba(255,255,255,.6);
  display: grid; place-items: center; padding: 18%; cursor: pointer; position: relative; color: var(--bubble-ink);
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0 6%, rgba(255,255,255,0) 7%),
    radial-gradient(circle at 36% 30%, rgba(255,255,255,.6), rgba(255,255,255,0) 45%),
    radial-gradient(circle at 70% 75%, rgba(169,193,234,.55), rgba(255,255,255,0) 60%),
    rgba(214, 205, 240, .75);
  box-shadow: inset -12px -16px 30px rgba(40,20,80,.10), 0 18px 40px rgba(60,40,100,.18);
  animation: breathe 8s ease-in-out infinite;
}
.release-bubble p {
  margin: 0; font-size: .98rem; line-height: 1.45; text-align: center; overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 7; -webkit-box-orient: vertical; word-break: break-word;
}
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.release-bubble.pop { animation: pop .7s ease-out forwards; }
@keyframes pop {
  0% { transform: scale(1.05); opacity: 1; }
  40% { transform: scale(1.18); opacity: .9; }
  100% { transform: scale(1.45); opacity: 0; filter: blur(4px); }
}
.droplet {
  position: absolute; width: 12px; height: 12px; border-radius: 50%; left: 50%; top: 50%;
  background: rgba(203, 184, 238, .9); pointer-events: none;
  animation: fly .9s ease-out forwards;
}
@keyframes fly {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.2); opacity: 0; }
}
.after { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.after p { margin: 0; max-width: 38ch; }

/* Kalender */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h3 { font-size: 1.2rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-wd { text-align: center; font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .5px; padding-bottom: 4px; }
.cal-day {
  aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; font-size: .95rem; position: relative;
}
.cal-day.has { color: var(--bubble-ink); font-weight: 700; box-shadow: inset -3px -4px 8px rgba(40,20,80,.08); }
.cal-day.today { border: 2px solid var(--accent); }
.cal-day:disabled { color: var(--muted); opacity: .45; cursor: default; }
.cal-day .cnt { position: absolute; bottom: 12%; font-size: .55rem; line-height: 1; letter-spacing: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: .88rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

/* Tab-Leiste */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button {
  border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border-radius: 14px; color: var(--muted); font-size: .78rem; font-weight: 700; min-height: 52px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Dialog */
dialog {
  border: 0; padding: 0; border-radius: var(--r-lg); background: var(--surface); color: var(--ink);
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 80px rgba(20,10,50,.35);
}
dialog::backdrop { background: rgba(26, 20, 45, .45); backdrop-filter: blur(3px); }
dialog[open] { animation: sheet .3s ease-out; }
@keyframes sheet { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 40px); overflow-y: auto; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-head .chip { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--bubble-ink); }
.dlg-head .chip svg { width: 34px; height: 34px; }
.dlg-head .ttl { min-width: 0; flex: 1; }
.dlg-head .ttl p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.answer h4 { margin: 0 0 4px; font-size: .9rem; color: var(--muted); font-weight: 700; }
.answer p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.answer p.none { color: var(--muted); font-style: italic; }
.confirm { background: var(--accent-soft); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; }
.copy-area { width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.file-label { position: relative; overflow: hidden; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.lang-row { display: flex; flex-direction: column; gap: 8px; }
.lang-row .seg { flex-wrap: wrap; }
nav.tabs button span { text-align: center; line-height: 1.15; }

/* Wetter, Wasser, Bilder */
.sub-hint { margin-top: 8px; font-size: .85rem; }
.mood-opt .dot.wdot svg { width: 30px; height: 30px; }
.glasses { display: flex; gap: 4px; flex-wrap: wrap; }
.glass-btn { width: 52px; height: 60px; border: 0; background: transparent; border-radius: 14px; padding: 4px; cursor: pointer; color: var(--muted); display: grid; place-items: center; transition: transform .15s, background .2s; }
.glass-btn:hover { background: var(--accent-soft); }
.glass-btn:active { transform: scale(.92); }
.glass-btn svg { width: 32px; height: 42px; }
.water-out { margin: 6px 0 0; font-weight: 700; font-size: .95rem; }
.q-title { font-weight: 700; }
.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.photo-item { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--accent-soft); border: 0; padding: 0; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-item.missing img { opacity: 0; }
.photo-item .rm { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(26, 20, 45, .66); color: #fff; display: grid; place-items: center; cursor: pointer; }
.photo-thumb { cursor: zoom-in; }
.file-label svg { flex: none; }
.meta-row { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
.meta-chip { display: flex; align-items: center; gap: 10px; min-width: 0; }
.meta-chip .wi { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--bubble-ink); }
.meta-chip .wi svg { width: 26px; height: 26px; }
.meta-k { display: block; font-size: .8rem; color: var(--muted); font-weight: 700; }
.mini-glasses { display: inline-flex; gap: 1px; color: var(--muted); }
.mini-glasses svg { width: 15px; height: 20px; }
.row-icons { display: inline-flex; gap: 8px; align-items: center; vertical-align: -3px; color: var(--muted); font-weight: 400; }
.row-icons .ri { display: inline-flex; align-items: center; gap: 2px; font-size: .8rem; }
.row-icons svg { width: 17px; height: 17px; }
dialog.lb { background: transparent; box-shadow: none; width: min(96vw, 900px); max-height: 94vh; overflow: visible; padding: 0; }
dialog.lb::backdrop { background: rgba(16, 12, 28, .82); }
dialog.lb img { max-width: 100%; max-height: 86vh; display: block; margin: 0 auto; border-radius: 18px; }
.lb-x { position: absolute; top: -52px; right: 0; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: .95rem; z-index: 40;
  max-width: calc(100vw - 32px); text-align: center; box-shadow: var(--shadow); transition: opacity .3s;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .bubble, .release-bubble { animation: none !important; }
  .release-bubble.pop { animation: fadeout .5s linear forwards !important; animation-duration: .5s !important; }
  @keyframes fadeout { to { opacity: 0; } }
  .droplet { display: none; }
}
@media (max-width: 380px) {
  .mood-opt .dot { width: 44px; height: 44px; }
  .mood-opt .dot svg { width: 28px; height: 28px; }
  .mood-opt span.lbl { font-size: .72rem; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">

      for (const file of files) {
        if (f.photos.length >= MAX_PHOTOS) { toast(t("photos.max")); break; }
        try {
          const blob = await shrink(file);
          f.photos.push({ id: "p" + uid(), blob, url: URL.createObjectURL(blob) });
        } catch (err) { toast(t("photos.error")); }
        renderFormPhotos(prefix);
      }
    });
    renderFormPhotos(prefix);
  }
  function renderFormPhotos(prefix) {
    const f = forms[prefix], box = $("#" + prefix + "-photos");
    if (!f || !box) return;
    box.innerHTML = f.photos.map((p, idx) => `<div class="photo-item"><img alt="" data-pid="${p.id}"><button type="button" class="rm" data-rm="${idx}" aria-label="${esc(t("photos.remove"))}">${X_ICON}</button></div>`).join("");
    box.hidden = !f.photos.length;
    fillImgs(box, f.photos);
    $("#" + prefix + "-photo-add").hidden = f.photos.length >= MAX_PHOTOS;
  }
  async function commitPhotos(prefix) {
    const f = forms[prefix];
    const ids = [];
    let failed = false;
    for (const p of f.photos) {
      if (p.blob) {
        try { await PhotoDB.put(p.id, p.blob); ids.push(p.id); urlCache.set(p.id, p.url); }
        catch (e) { failed = true; URL.revokeObjectURL(p.url); }
      } else ids.push(p.id);
    }
    for (const id of f.removed) { try { await PhotoDB.del(id); } catch (e) {} dropUrl(id); }
    if (failed) toast(t("photos.storeFail"));
    if (ids.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return ids;
  }

  // ---------- Navigation ----------
  const TABS = ["heute", "blasen", "loslassen", "rueckblick"];
  let current = "heute";
  function go(tab, opts = {}) {
    if (!TABS.includes(tab)) tab = "heute";
    current = tab;
    TABS.forEach(x => { $("#view-" + x).hidden = x !== tab; });
    document.querySelectorAll("nav.tabs button").forEach(b => {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "blasen") renderBlasen(opts.fresh);
    if (tab === "rueckblick") renderCal();
    if (tab === "loslassen") renderRelease();
    if (!opts.keepScroll) window.scrollTo({ top: 0 });
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

  // ---------- Check-in ----------
  function formHTML(prefix, e, withDate) {
    const mood = e ? e.mood : 0;
    const moods = [1, 2, 3, 4, 5].map(m => `
      <div class="mood-opt">
        <input type="radio" name="${prefix}-mood" id="${prefix}-mood-${m}" value="${m}" ${mood === m ? "checked" : ""}>
        <label for="${prefix}-mood-${m}"><span class="dot" style="background:${MOOD_COLORS[m]};color:var(--bubble-ink)">${face(m)}</span><span class="lbl">${esc(moodLabel(m))}</span></label>
      </div>`).join("");
    const qs = QUESTIONS.map(k => `
      <div class="q">
        <label for="${prefix}-${k}">${esc(t("q." + k))}</label>
        <textarea id="${prefix}-${k}" placeholder="${esc(t("ph." + k))}" rows="3">${esc(e ? e[k] : "")}</textarea>
      </div>`).join("");
    const weather = e ? (e.weather || 0) : 0;
    const weathers = [1, 2, 3, 4, 5].map(w => `
      <div class="mood-opt">
        <input type="radio" name="${prefix}-weather" id="${prefix}-weather-${w}" value="${w}" ${weather === w ? "checked" : ""}>
        <label for="${prefix}-weather-${w}"><span class="dot wdot" style="background:${WEATHER_COLORS[w]};color:var(--bubble-ink)">${weatherIcon(w)}</span><span class="lbl">${esc(weatherLabel(w))}</span></label>
      </div>`).join("");
    const extras = `
      <fieldset><legend>${esc(t("weather.legend"))}</legend><div class="moods">${weathers}</div><p class="hint sub-hint">${esc(t("weather.hint"))}</p></fieldset>
      <fieldset><legend>${esc(t("water.legend"))}</legend>
        <div class="glasses" id="${prefix}-water"></div>
        <p class="water-out" id="${prefix}-water-out" aria-live="polite"></p>
        <p class="hint sub-hint">${esc(t("water.hint"))}</p>
      </fieldset>`;
    const photos = `
      <div class="q">
        <span class="q-title">${esc(t("photos.legend"))}</span>
        <div class="photos" id="${prefix}-photos" hidden></div>
        <div class="row"><label class="btn ghost small file-label" id="${prefix}-photo-add">${CAM_ICON}${esc(t("photos.add"))}<input type="file" id="${prefix}-photo-input" accept="image/*" multiple></label></div>
        <small>${esc(t("photos.hint"))}</small>
      </div>`;
    const date = e ? e.date : todayIso();
    const dateBlock = withDate ? `
      <details class="when" ${date !== todayIso() ? "open" : ""}>
        <summary>${esc(t("form.otherDay"))}</summary>
        <input type="date" id="${prefix}-date" value="${date}" max="${todayIso()}" aria-label="${esc(t("form.dateAria"))}">
      </details>` : `<div class="q"><label for="${prefix}-date">${esc(t("form.date"))}</label><input type="date" id="${prefix}-date" value="${date}" max="${todayIso()}"></div>`;
    return `
      <fieldset><legend>${esc(t("mood.legend"))}</legend><div class="moods">${moods}</div></fieldset>
      ${extras}
      ${qs}
      ${photos}
      ${dateBlock}`;
  }
  function readForm(prefix) {
    const m = document.querySelector(`input[name="${prefix}-mood"]:checked`);
    const date = $("#" + prefix + "-date").value || todayIso();
    const f = forms[prefix] || { weather: 0, water: 0 };
    const out = { mood: m ? Number(m.value) : 0, date: date > todayIso() ? todayIso() : date, weather: f.weather, water: f.water };
    QUESTIONS.forEach(k => { out[k] = $("#" + prefix + "-" + k).value.trim(); });
    return out;
  }

  function renderCheckin(presetDate) {
    const card = $("#checkinCard");
    card.innerHTML = `
      <form class="form" id="ciForm" novalidate>
        ${formHTML("ci", presetDate ? { mood: 0, date: presetDate, now: "", mind: "", nice: "" } : null, true)}
        <div class="form-foot">
          <button class="btn" type="submit" id="ciSave" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="7"/><circle cx="17.5" cy="5.5" r="2"/></svg>
            ${esc(t("form.save"))}
          </button>
          <p class="hint" id="ciHint">${esc(t("form.hintPick"))}</p>
        </div>
      </form>`;
    const form = $("#ciForm");
    setupForm("ci", presetDate ? { date: presetDate } : null);
    form.addEventListener("change", ev => {
      if (ev.target && ev.target.type === "file") return;
      const ok = !!form.querySelector('input[name="ci-mood"]:checked');
      $("#ciSave").disabled = !ok;
      $("#ciHint").textContent = ok ? t("form.hintEmpty") : t("form.hintPick");
    });
    form.addEventListener("submit", async ev => {
      ev.preventDefault();
      const data = readForm("ci");
      if (!data.mood) return;
      $("#ciSave").disabled = true;
      data.photos = await commitPhotos("ci");
      const now = new Date().toISOString();
      const entry = { id: uid(), ...data, createdAt: now, updatedAt: now };
      entries.push(entry);
      persist();
      renderCheckin();
      toast(t("toast.saved"));
      go("blasen", { fresh: entry.id });
    });
  }

  // ---------- Blasen ----------
  let viewMode = "bubbles";
  const MAX_BUBBLES = 30;
  $("#segBubbles").addEventListener("click", () => setMode("bubbles"));
  $("#segList").addEventListener("click", () => setMode("list"));
  function setMode(m) {
    viewMode = m;
    $("#segBubbles").setAttribute("aria-pressed", m === "bubbles");
    $("#segList").setAttribute("aria-pressed", m === "list");
    $("#bubbleWrap").hidden = m !== "bubbles";
    $("#list").hidden = m !== "list";
    try { localStorage.setItem("gedankenblasen.ansicht", m); } catch (e) {}
    renderBlasen();
  }

  function renderBlasen(freshId) {
    if (viewMode === "list") { renderList(); return; }
    const field = $("#field");
    const real = sorted(entries);
    const showSamples = real.length === 0;
    const items = showSamples ? samples() : real.slice(0, MAX_BUBBLES);
    const W = field.clientWidth || 340;
    let H = Math.max(420, Math.min(760, 220 + items.length * 26));
    const placed = [];
    const nodes = [];
    items.forEach(e => {
      const len = (e.now + e.mind + e.nice).length;
      const base = Math.min(W / 3.2, 120);
      const size = Math.round(Math.max(72, Math.min(base, 74 + Math.sqrt(len) * 3.6)));
      const r = rng(hash(e.id));
      let x, y, ok = false;
      for (let tr = 0; tr < 400 && !ok; tr++) {
        if (tr > 0 && tr % 80 === 0) H += 70;
        x = 10 + r() * Math.max(1, W - size - 20);
        y = 14 + r() * Math.max(1, H - size - (showSamples ? 120 : 28));
        ok = placed.every(p => Math.hypot((p.x + p.s / 2) - (x + size / 2), (p.y + p.s / 2) - (y + size / 2)) > (p.s + size) / 2 + 8);
      }
      placed.push({ x, y, s: size });
      const d = parseIso(e.date);
      const label = t(e.sample ? "aria.sample" : "aria.entry", { date: longDate(d), mood: moodLabel(e.mood) });
      nodes.push(`<button type="button" class="bubble${e.sample ? " sample" : ""}${e.id === freshId ? " fresh" : ""}" data-id="${e.id}"
        style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;--c:${MOOD_COLORS[e.mood]};--dur:${(6 + r() * 5).toFixed(2)}s;--delay:-${(r() * 6).toFixed(2)}s;--dx:${(r() * 8 - 4).toFixed(1)}px"
        aria-label="${esc(label)}">${face(e.mood)}<span class="bd">${esc(e.sample ? t("sample.word") : fmtShort.format(d))}</span></button>`);
    });
    field.style.height = H + "px";
    field.innerHTML = nodes.join("") + (showSamples ? `
      <div class="field-empty">
        <p>${esc(t("field.empty"))}</p>
        <button class="btn small" type="button" data-go="heute">${esc(t("field.first"))}</button>
      </div>` : "");
    const more = $("#fieldMore");
    if (!showSamples && real.length > MAX_BUBBLES) {
      more.hidden = false;
      more.textContent = t("field.more", { max: MAX_BUBBLES, n: real.length });
    } else more.hidden = true;
  }
  $("#field").addEventListener("click", ev => {
    const b = ev.target.closest(".bubble");
    if (b) { openEntry(b.dataset.id); return; }
    if (ev.target.closest("[data-go]")) go(ev.target.closest("[data-go]").dataset.go);
  });
  let resizeT;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (current === "blasen") renderBlasen(); }, 200); });

  function renderList() {
    const list = $("#list");
    const real = sorted(entries);
    if (!real.length) {
      list.innerHTML = `<div class="empty"><p>${esc(t("list.empty"))}</p><button class="btn small" type="button" data-go="heute">${esc(t("list.toCheckin"))}</button></div>`;
      return;
    }
    const groups = new Map();
    real.forEach(e => {
      const k = e.date.slice(0, 7);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    });
    list.innerHTML = [...groups].map(([k, arr]) => `
      <div class="list-month">
        <h3>${esc(cap(fmtMonth.format(parseIso(k + "-01"))))}</h3>
        <div class="list-items">${arr.map(e => rowHTML(e)).join("")}</div>
      </div>`).join("");
  }
  function rowHTML(e, from) {
    const snippet = e.now || e.nice || e.mind || t("list.onlyMood");
    const attr = from ? `data-from="${from}" data-dayentry="${e.id}"` : `data-id="${e.id}"`;
    const nPh = (e.photos || []).length;
    const icons = (e.weather ? `<span class="ri" title="${esc(weatherLabel(e.weather))}">${weatherIcon(e.weather)}</span>` : "")
      + (nPh ? `<span class="ri">${CAM_ICON}<span>${nPh}</span></span>` : "");
    return `<button type="button" class="entry-row" ${attr}>
      <span class="chip" style="background:${MOOD_COLORS[e.mood]}">${face(e.mood)}</span>
      <span class="meta"><strong>${esc(longDate(parseIso(e.date)))} · ${esc(moodLabel(e.mood))}${icons ? ` <span class="row-icons" aria-hidden="true">${icons}</span>` : ""}</strong><span>${esc(snippet)}</span></span>
    </button>`;
  }
  $("#list").addEventListener("click", ev => {
    const r = ev.target.closest(".entry-row");
    if (r) openEntry(r.dataset.id);
    const g = ev.target.closest("[data-go]");
    if (g) go(g.dataset.go);
  });

  // ---------- Dialog ----------
  const dlg = $("#dlg"), body = $("#dlgBody");
  let lastFocus = null;
  function openDlg(html) {
    lastFocus = document.activeElement;
    body.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    body.scrollTop = 0;
    const f = body.querySelector("[autofocus]") || body.querySelector("button, textarea, input");
    if (f) f.focus();
  }
  function closeDlg() { if (dlg.open) dlg.close(); }
  dlg.addEventListener("close", () => { if (lastFocus && lastFocus.isConnected) lastFocus.focus(); });
  dlg.addEventListener("click", ev => { if (ev.target === dlg) closeDlg(); });
  const closeBtn = () => `<button class="icon-btn" type="button" data-close aria-label="${esc(t("dlg.close"))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

  function findEntry(id) { return entries.find(e => e.id === id) || samples().find(e => e.id === id); }

  function openEntry(id, from) {
    const e = findEntry(id);
    if (!e) return;
    const d = parseIso(e.date);
    const answers = QUESTIONS.map(k => `<div class="answer"><h4>${esc(t("q." + k))}</h4>${e[k] ? `<p>${esc(e[k])}</p>` : `<p class="none">${esc(t("dlg.nothing"))}</p>`}</div>`).join("");
    const edited = e.updatedAt && e.createdAt && e.updatedAt !== e.createdAt ? ` · ${esc(t("dlg.edited"))}` : "";
    const time = e.createdAt ? ` · ${esc(t("dlg.time", { t: fmtTime.format(new Date(e.createdAt)) }))}` : "";
    const meta = [];
    if (e.weather) meta.push(`<div class="meta-chip"><span class="wi" style="background:${WEATHER_COLORS[e.weather]}">${weatherIcon(e.weather)}</span><span><span class="meta-k">${esc(t("dlg.weather"))}</span>${esc(weatherLabel(e.weather))}</span></div>`);
    if (e.water) meta.push(`<div class="meta-chip">${miniGlasses(e.water)}<span><span class="meta-k">${esc(t("dlg.water"))}</span>${esc(waterText(e.water))}</span></div>`);
    const alt = t("photos.alt", { date: longDate(d) });
    const ph = (e.photos || []);
    const gallery = ph.length ? `<div class="answer"><h4>${esc(t("photos.legend"))}</h4><div class="photos">${ph.map(id =>
      `<button type="button" class="photo-item photo-thumb" data-photo="${id}" aria-label="${esc(t("photos.open"))}"><img alt="${esc(alt)}" data-pid="${id}"></button>`).join("")}</div></div>` : "";
    openDlg(`
      <div class="dlg-head">
        <span class="chip" style="background:${MOOD_COLORS[e.mood]}">${face(e.mood)}</span>
        <div class="ttl"><h3 id="dlgTitle">${esc(longDate(d))}</h3><p>${esc(moodLabel(e.mood))}${time}${edited}</p></div>
        ${closeBtn()}
      </div>
      ${e.sample ? `<div class="note"><p>${esc(t("dlg.sampleNote"))}</p></div>` : ""}
      ${meta.length ? `<div class="meta-row">${meta.join("")}</div>` : ""}
      ${answers}
      ${gallery}
      ${e.sample ? "" : `
      <div id="actArea" class="row">
        <button class="btn small" type="button" data-edit="${e.id}">${esc(t("dlg.edit"))}</button>
        <button class="btn ghost small" type="button" data-askdel="${e.id}">${esc(t("dlg.delete"))}</button>
        ${from ? `<button class="btn ghost small" type="button" data-day="${from}">${esc(t("dlg.backToDay"))}</button>` : ""}
      </div>`}`);
    fillImgs(body);
  }

  // Bild groß anzeigen
  const lb = $("#lb"), lbImg = $("#lbImg");
  function openLightbox(id, alt) {
    getPhotoURL(id).then(u => {
      if (!u) { toast(t("photos.missing")); return; }
      lbImg.src = u; lbImg.alt = alt || "";
      $("#lbClose").setAttribute("aria-label", t("dlg.close"));
      if (!lb.open) lb.showModal();
    });
  }
  lb.addEventListener("click", () => lb.close());

  function openEdit(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    openDlg(`
      <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(t("edit.title"))}</h3><p>${esc(longDate(parseIso(e.date)))}</p></div>${closeBtn()}</div>
      <form class="form" id="edForm" novalidate>
        ${formHTML("ed", e, false)}
        <div class="row">
          <button class="btn" type="submit">${esc(t("edit.save"))}</button>
          <button class="btn ghost" type="button" data-view="${e.id}">${esc(t("edit.cancel"))}</button>
        </div>
      </form>`);
    setupForm("ed", e);
    $("#edForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const data = readForm("ed");
      if (!data.mood) { toast(t("toast.pickMood")); return; }
      data.photos = await commitPhotos("ed");
      Object.assign(e, data, { updatedAt: new Date().toISOString() });
      persist();
      refresh();
      toast(t("toast.changes"));
      openEntry(e.id);
    });
  }

  function askDelete(id) {
    const area = $("#actArea");
    if (!area) return;
    area.outerHTML = `<div class="confirm" id="actArea">
      <p>${esc(t("del.confirm"))}</p>
      <div class="row">
        <button class="btn danger small" type="button" data-del="${id}">${esc(t("del.yes"))}</button>
        <button class="btn ghost small" type="button" data-view="${id}">${esc(t("del.keep"))}</button>
      </div></div>`;
    body.querySelector("[data-view]").focus();
  }

  body.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-close")) closeDlg();
    else if (b.dataset.photo) { const im = b.querySelector("img"); openLightbox(b.dataset.photo, im ? im.alt : ""); }
    else if (b.dataset.edit) openEdit(b.dataset.edit);
    else if (b.dataset.askdel) askDelete(b.dataset.askdel);
    else if (b.dataset.view) openEntry(b.dataset.view);
    else if (b.dataset.del) {
      const gone = entries.find(e => e.id === b.dataset.del);
      ((gone && gone.photos) || []).forEach(id => { PhotoDB.del(id).catch(() => {}); dropUrl(id); });
      entries = entries.filter(e => e.id !== b.dataset.del);
      persist(); closeDlg(); refresh(); toast(t("toast.deleted"));
    }
    else if (b.dataset.day) openDay(b.dataset.day);
    else if (b.dataset.dayentry) openEntry(b.dataset.dayentry, b.dataset.from);
    else if (b.dataset.writeday) { closeDlg(); renderCheckin(b.dataset.writeday); go("heute"); }
    else if (b.dataset.lang) { setLang(b.dataset.lang); openInfo(); }
  });

  function refresh() {
    if (current === "blasen") renderBlasen();
    if (current === "rueckblick") renderCal();
  }

  // ---------- Loslassen ----------
  let releaseState = "write";
  function renderRelease() {
    const card = $("#releaseCard");
    if (releaseState === "write") {
      card.innerHTML = `
        <form class="form" id="relForm" novalidate>
          <div class="q">
            <label for="relText">${esc(t("los.q"))}</label>
            <textarea id="relText" rows="5" placeholder="${esc(t("los.ph"))}" autocomplete="off"></textarea>
          </div>
          <div class="form-foot">
            <button class="btn" type="submit" id="relGo" disabled>${esc(t("los.go"))}</button>
          </div>
        </form>`;
      const ta = $("#relText"), btn = $("#relGo");
      ta.addEventListener("input", () => { btn.disabled = !ta.value.trim(); });
      $("#relForm").addEventListener("submit", ev => {
        ev.preventDefault();
        const text = ta.value.trim();
        if (!text) return;
        ta.value = "";
        releaseState = "bubble";
        card.innerHTML = `
          <div class="release-stage" id="relStage">
            <button type="button" class="release-bubble" id="relBubble" aria-label="${esc(t("los.pop"))}"><p></p></button>
          </div>
          <div class="after">
            <p class="hint">${esc(t("los.breath"))}</p>
            <button class="btn" type="button" id="relPop">${esc(t("los.pop"))}</button>
          </div>`;
        $("#relBubble p").textContent = text;
        $("#relBubble").addEventListener("click", popIt);
        $("#relPop").addEventListener("click", popIt);
      });
    } else if (releaseState === "done") {
      card.innerHTML = `
        <div class="after" style="padding:24px 0">
          <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="6" fill="var(--m2)"/><circle cx="16" cy="22" r="3.5" fill="var(--m1)"/><circle cx="56" cy="20" r="3" fill="var(--m4)"/><circle cx="58" cy="52" r="4" fill="var(--m3)"/><circle cx="14" cy="54" r="2.5" fill="var(--m5)"/></svg>
          <h3 tabindex="-1" id="relDone">${esc(t("los.done"))}</h3>
          <p>${esc(t("los.doneText"))}</p>
          <button class="btn ghost" type="button" id="relAgain">${esc(t("los.again"))}</button>
        </div>`;
      $("#relAgain").addEventListener("click", () => { releaseState = "write"; renderRelease(); $("#relText").focus(); });
    }
  }
  function popIt() {
    const b = $("#relBubble");
    if (!b || b.classList.contains("pop")) return;
    const stage = $("#relStage");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    b.classList.add("pop");
    $("#relPop").disabled = true;
    if (!reduce) {
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span");
        s.className = "droplet";
        const a = (i / 14) * Math.PI * 2 + Math.random() * .3;
        const dist = 120 + Math.random() * 60;
        s.style.setProperty("--tx", Math.cos(a) * dist + "px");
        s.style.setProperty("--ty", Math.sin(a) * dist + "px");
        s.style.background = MOOD_COLORS[(i % 5) + 1];
        const sz = 6 + Math.random() * 10;
        s.style.width = s.style.height = sz + "px";
        stage.appendChild(s);
      }
    }
    setTimeout(() => {
      releaseState = "done";
      renderRelease();
      const h = $("#relDone"); if (h) h.focus();
    }, reduce ? 550 : 950);
  }

  // ---------- Rückblick ----------
  let calY, calM;
  (() => { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); })();
  $("#calPrev").addEventListener("click", () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); });
  $("#calNext").addEventListener("click", () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); });

  function byDay() {
    const m = new Map();
    entries.forEach(e => { if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); });
    return m;
  }
  function renderCal() {
    const now = new Date();
    $("#calTitle").textContent = cap(fmtMonth.format(new Date(calY, calM, 1)));
    $("#calNext").disabled = calY > now.getFullYear() || (calY === now.getFullYear() && calM >= now.getMonth());
    $("#calNext").style.opacity = $("#calNext").disabled ? .35 : 1;
    const days = byDay();
    const first = new Date(calY, calM, 1);
    const offset = (first.getDay() + 6) % 7;
    const count = new Date(calY, calM + 1, 0).getDate();
    const td = todayIso();
    // Wochentage ab Montag (5. Jan. 2026 ist ein Montag)
    let html = [0, 1, 2, 3, 4, 5, 6].map(i => `<div class="cal-wd" aria-hidden="true">${esc(cap(fmtWd.format(new Date(2026, 0, 5 + i)).replace(".", "")).slice(0, 3))}</div>`).join("");
    for (let i = 0; i < offset; i++) html += `<div></div>`;
    for (let d = 1; d <= count; d++) {
      const key = `${calY}-${pad(calM + 1)}-${pad(d)}`;
      const list = days.get(key) || [];
      const future = key > td;
      let style = "", cls = "cal-day", label;
      const long = longDate(new Date(calY, calM, d));
      if (list.length) {
        const avg = Math.round(list.reduce((s, e) => s + e.mood, 0) / list.length);
        style = `background:${MOOD_COLORS[avg]}`;
        cls += " has";
        label = t("rb.has", { date: long, count: countText(list.length), mood: moodLabel(avg) });
      } else label = future ? long : t("rb.none", { date: long });
      if (key === td) cls += " today";
      html += `<button type="button" class="${cls}" style="${style}" data-date="${key}" ${future ? "disabled" : ""} aria-label="${esc(label)}">${d}${list.length > 1 ? `<span class="cnt" aria-hidden="true">${"•".repeat(Math.min(list.length, 3))}</span>` : ""}</button>`;
    }
    $("#calGrid").innerHTML = html;
  }
  $("#calGrid").addEventListener("click", ev => {
    const b = ev.target.closest(".cal-day");
    if (b && !b.disabled) openDay(b.dataset.date);
  });
  function openDay(date) {
    const list = sorted(entries.filter(e => e.date === date));
    const long = longDate(parseIso(date));
    if (!list.length) {
      openDlg(`
        <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(long)}</h3><p>${esc(t("day.none"))}</p></div>${closeBtn()}</div>
        <p style="margin:0">${esc(t("day.ask"))}</p>
        <div class="row"><button class="btn small" type="button" data-writeday="${date}">${esc(t("day.write"))}</button></div>`);
      return;
    }
    if (list.length === 1) { openEntry(list[0].id); return; }
    openDlg(`
      <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(long)}</h3><p>${esc(countText(list.length))}</p></div>${closeBtn()}</div>
      <div class="list-items">${list.map(e => rowHTML(e, date)).join("")}</div>`);
  }

  // ---------- Info, Sicherung & Sprache ----------
  let downloads = null;
  (async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); } catch (e) {} })();
  const inArtifact = !!(window.claude && window.claude.use);

  function backupName() { return `${t("backup.file")}-${todayIso()}.json`; }
  function backupData() { return JSON.stringify({ app: "Gedankenblasen", version: 2, exportiert: new Date().toISOString(), eintraege: sorted(entries) }, null, 2); }
  function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
  function dataURLToBlob(d) {
    const comma = d.indexOf(",");
    const mime = (d.slice(0, comma).match(/data:([^;]+)/) || [])[1] || "image/jpeg";
    const bin = atob(d.slice(comma + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  async function buildBackup() {
    const fotos = {};
    for (const e of entries) for (const id of (e.photos || [])) {
      if (fotos[id]) continue;
      try { const blob = await PhotoDB.get(id); if (blob) fotos[id] = await blobToDataURL(blob); } catch (err) {}
    }
    return JSON.stringify({ app: "Gedankenblasen", version: 2, exportiert: new Date().toISOString(), eintraege: sorted(entries), fotos }, null, 2);
  }
  let backupReady = null;

  function openInfo() {
    backupReady = null;
    buildBackup().then(d => { backupReady = d; const b = $("#expBtn"); if (b && entries.length) b.disabled = false; });
    const langBtns = LANGS.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}" lang="${l}">${I18N[l].name}</button>`).join("");
    openDlg(`
      <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(t("info.title"))}</h3><p>${esc(t("info.count", { count: countText(entries.length) }))}</p></div>${closeBtn()}</div>
      <div class="lang-row"><span class="hint" id="langLbl">${esc(t("info.lang"))} · Sprache · Language · Langue</span>
        <div class="seg" role="group" aria-labelledby="langLbl">${langBtns}</div></div>
      ${storageOk ? "" : `<div class="confirm"><p>${esc(t("info.warn"))}</p></div>`}
      <p style="margin:0">${esc(t("info.p1"))}</p>
      <p style="margin:0">${esc(t("info.p2"))}</p>
      <p style="margin:0">${esc(t("info.p3"))}</p>
      <div class="row">
        <button class="btn small" type="button" id="expBtn" ${entries.length && backupReady ? "" : "disabled"}>${esc(t("info.export"))}</button>
        <button class="btn ghost small" type="button" id="copyBtn" ${entries.length ? "" : "disabled"}>${esc(t("info.copy"))}</button>
        <label class="btn ghost small file-label">${esc(t("info.import"))}<input type="file" id="impFile" accept=".json,application/json"></label>
      </div>
      <div id="copyWrap" hidden>
        <label for="copyArea" class="hint">${esc(t("info.copyLabel"))}</label>
        <textarea id="copyArea" class="copy-area" readonly></textarea>
      </div>
      <p class="hint">${esc(t("info.importHint"))}</p>
      <p class="hint" style="margin:0">Gedankenblasen · Version ${APP_VERSION}</p>`);
    $("#expBtn").addEventListener("click", exportBackup);
    $("#copyBtn").addEventListener("click", copyBackup);
    $("#impFile").addEventListener("change", importBackup);
  }
  async function exportBackup() {
    const data = backupReady || backupData();
    if (downloads) {
      try { await downloads.save({ filename: backupName(), data }); toast(t("toast.backupSaved")); }
      catch (e) {
        if (e && e.code === "declined") toast(t("toast.backupCancel"));
        else { toast(t("toast.noDownload")); showCopy(data); }
      }
      return;
    }
    if (inArtifact) { showCopy(data); toast(t("toast.noDownload")); return; }
    try {
      const file = new File([data], backupName(), { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Gedankenblasen" });
        toast(t("toast.shared"));
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") { toast(t("toast.backupCancel")); return; } }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t("toast.downloaded"));
    } catch (e) { showCopy(data); }
  }
  function showCopy(data) {
    $("#copyWrap").hidden = false;
    const ta = $("#copyArea"); ta.value = data; ta.focus(); ta.select();
  }
  function copyBackup() {
    const data = backupData();
    const fallback = () => { showCopy(data); toast(t("toast.marked")); };
    try {
      navigator.clipboard.writeText(data).then(() => toast(t("toast.copied")), fallback);
    } catch (e) { fallback(); }
  }
  function importBackup(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(reader.result);
        const arr = Array.isArray(parsed) ? parsed : parsed.eintraege;
        if (!Array.isArray(arr)) throw new Error();
        const fotos = parsed && typeof parsed.fotos === "object" && parsed.fotos ? parsed.fotos : {};
        const valid = arr.filter(validEntry).map(e => ({
          id: e.id, date: e.date, mood: e.mood,
          weather: Number.isInteger(e.weather) && e.weather >= 1 && e.weather <= 5 ? e.weather : 0,
          water: typeof e.water === "number" && e.water >= 0 && e.water <= 5 ? Math.round(e.water * 2) / 2 : 0,
          photos: Array.isArray(e.photos) ? e.photos.filter(p => typeof p === "string" && /^p[a-z0-9]+$/i.test(p)).slice(0, MAX_PHOTOS) : [],
          now: String(e.now || ""), mind: String(e.mind || ""), nice: String(e.nice || ""),
          createdAt: e.createdAt || new Date().toISOString(), updatedAt: e.updatedAt || e.createdAt || new Date().toISOString(),
        }));
        const ids = new Set(entries.map(e => e.id));
        const added = valid.filter(e => !ids.has(e.id));
        for (const e of added) {
          const kept = [];
          for (const id of e.photos) {
            const d = fotos[id];
            if (typeof d === "string" && d.startsWith("data:image/")) {
              try { await PhotoDB.put(id, dataURLToBlob(d)); kept.push(id); } catch (err) {}
            }
          }
          e.photos = kept;
        }
        entries = entries.concat(added);
        persist(); refresh();
        toast(added.length ? t("toast.imported", { count: countText(added.length) }) : t("toast.importNone"));
        openInfo();
      } catch (e) { toast(t("toast.importError")); }
    };
    reader.readAsText(file);
  }
  $("#infoBtn").addEventListener("click", openInfo);
  document.addEventListener("click", ev => { if (ev.target.closest("[data-open-info]")) openInfo(); });

  // Hinweis beim ersten Start
  let noteSeen = false;
  try { noteSeen = localStorage.getItem(NOTE_KEY) === "1"; } catch (e) {}
  $("#storageNote").hidden = noteSeen;
  $("#noteClose").addEventListener("click", () => { $("#storageNote").hidden = true; try { localStorage.setItem(NOTE_KEY, "1"); } catch (e) {} });

  // ---------- Toast ----------
  let toastT;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.hidden = true; }, 3600);
  }

  // ---------- Start ----------
  makeFormatters();
  applyStatic();
  try { const m = localStorage.getItem("gedankenblasen.ansicht"); if (m === "list") viewMode = "list"; } catch (e) {}
  $("#segBubbles").setAttribute("aria-pressed", viewMode === "bubbles");
  $("#segList").setAttribute("aria-pressed", viewMode === "list");
  $("#bubbleWrap").hidden = viewMode !== "bubbles";
  $("#list").hidden = viewMode !== "list";
  renderCheckin();
  const hash0 = (location.hash || "").replace("#", "");
  go(TABS.includes(hash0) ? hash0 : "heute");
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}); });
}
</script>
</body>
