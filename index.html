<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gedankenblasen</title>
<meta name="description" content="Zwei Minuten am Abend: Stimmung festhalten, Gedanken als Blasen sammeln und loslassen.">
<meta name="theme-color" content="#F1EEF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1727" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gedankenblasen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">

<script>try{var t=localStorage.getItem('gedankenblasen.design');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
@font-face { font-family: "Fredoka"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: italic; font-display: swap; src: url("fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: eine ruhige Spalte wie ein Abendhimmel, unten eine Tab-Leiste mit vier Räumen */
:root {
  --bg: #F1EEF6;
  --bg-deep: #E6E0EF;
  --surface: #FCFBFE;
  --ink: #2A2638;
  --muted: #5E5770;
  --line: #DCD5E8;
  --accent: #6553A6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7E0F6;
  --danger: #A2384F;
  --bubble-ink: #2A2638;
  --shadow: 0 10px 30px rgba(70, 50, 120, .12);
  --m1: #A9C1EA; --m2: #CBB8EE; --m3: #BEDFC9; --m4: #F7CDB1; --m5: #F4E39B; --w3: #D9DCE6;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1727; --bg-deep: #14121F; --surface: #252136; --ink: #EEEAF6; --muted: #B6AFCA;
    --line: #3A3452; --accent: #BBAEF2; --accent-ink: #1A1727; --accent-soft: #332D4C;
    --danger: #F2A3B4; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --m1: #9DB5E0; --m2: #BFAAE6; --m3: #AFD3BA; --m4: #EDBF9F; --m5: #E9D88C; --w3: #B9BBCB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1727; --bg-deep: #14121F; --surface: #252136; --ink: #EEEAF6; --muted: #B6AFCA;
  --line: #3A3452; --accent: #BBAEF2; --accent-ink: #1A1727; --accent-soft: #332D4C;
  --danger: #F2A3B4; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --m1: #9DB5E0; --m2: #BFAAE6; --m3: #AFD3BA; --m4: #EDBF9F; --m5: #E9D88C; --w3: #B9BBCB;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-deep), var(--bg) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: .2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }

h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.view { display: flex; flex-direction: column; gap: 18px; }
.view[hidden] { display: none !important; }

.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
.note {
  display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft);
  border-radius: var(--r-md); padding: 14px 16px; font-size: .95rem;
}
.note p { margin: 0; }
.note .note-x { margin-left: auto; flex: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 700; }

/* Stimmung */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; padding: 0; margin-bottom: 12px; }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mood-opt { position: relative; }
.mood-opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.mood-opt label {
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 2px; border-radius: var(--r-md); border: 2px solid transparent; transition: background .2s, border-color .2s;
}
.mood-opt .dot {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  box-shadow: inset -4px -6px 10px rgba(0,0,0,.07); transition: transform .25s;
}
.mood-opt .dot svg { width: 34px; height: 34px; }
.mood-opt span.lbl { font-size: .8rem; color: var(--muted); text-align: center; line-height: 1.2; }
.mood-opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.mood-opt input:checked + label .dot { transform: scale(1.1); }
.mood-opt input:checked + label span.lbl { color: var(--ink); font-weight: 700; }
.mood-opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

.q { display: flex; flex-direction: column; gap: 6px; }
.q label { font-weight: 700; }
.q small { color: var(--muted); font-size: .85rem; }
textarea {
  width: 100%; min-height: 84px; resize: vertical; border-radius: var(--r-sm);
  border: 1.5px solid var(--line); background: var(--bg); padding: 12px 14px; line-height: 1.5;
}
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="date"] {
  border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg); padding: 8px 12px; max-width: 100%;
}
.form { display: flex; flex-direction: column; gap: 20px; }
.form-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }
details.when summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
details.when[open] summary { margin-bottom: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem;
  transition: transform .15s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Segment-Umschalter */
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; border: 1px solid var(--line); align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Blasenfeld */
.field {
  position: relative; width: 100%; border-radius: var(--r-lg); overflow: hidden;
  background: radial-gradient(90% 70% at 50% 100%, var(--accent-soft), transparent 70%), var(--surface);
  box-shadow: var(--shadow); min-height: 420px;
}
.bubble {
  position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); cursor: pointer; padding: 0;
  color: var(--bubble-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.9) 0 7%, rgba(255,255,255,0) 8%),
    radial-gradient(circle at 38% 32%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
    var(--c);
  box-shadow: inset -8px -10px 18px rgba(40,20,80,.10), 0 8px 18px rgba(60,40,100,.14);
  animation: float var(--dur, 8s) ease-in-out var(--delay, 0s) infinite alternate;
  transition: transform .2s;
}
.bubble:hover { filter: brightness(1.03); }
.bubble svg { width: 38%; height: 38%; }
.bubble .bd { font-size: .74rem; font-weight: 700; line-height: 1; }
.bubble.sample { opacity: .8; }
.bubble.sample .bd { font-weight: 400; font-style: italic; }
.bubble.fresh { animation: rise 1.6s cubic-bezier(.2,.8,.2,1) both, float var(--dur, 8s) ease-in-out 1.6s infinite alternate; }
@keyframes float {
  0% { transform: translate(0, 0); }
  50% { transform: translate(var(--dx, 4px), -10px); }
  100% { transform: translate(calc(var(--dx, 4px) * -1), -4px); }
}
@keyframes rise {
  0% { transform: translateY(180px) scale(.6); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.field-empty {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 18px; text-align: center;
  background: linear-gradient(transparent, var(--surface) 40%);
}
.field-empty p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
.field-more { color: var(--muted); font-size: .9rem; margin: 0; text-align: center; }

/* Liste */
.list { display: flex; flex-direction: column; gap: 20px; }
.list-month h3 { font-size: 1rem; color: var(--muted); margin-bottom: 8px; text-transform: none; }
.list-items { display: flex; flex-direction: column; gap: 8px; }
.entry-row {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; cursor: pointer;
}
.entry-row .chip { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--bubble-ink); }
.entry-row .chip svg { width: 26px; height: 26px; }
.entry-row .meta { min-width: 0; }
.entry-row .meta strong { display: block; font-size: .95rem; }
.entry-row .meta span { display: block; color: var(--muted); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }

/* Loslassen */
.release-stage { position: relative; display: grid; place-items: center; min-height: 340px; }
.release-bubble {
  width: min(78vw, 290px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid rgba(255,255,255,.6);
  display: grid; place-items: center; padding: 18%; cursor: pointer; position: relative; color: var(--bubble-ink);
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0 6%, rgba(255,255,255,0) 7%),
    radial-gradient(circle at 36% 30%, rgba(255,255,255,.6), rgba(255,255,255,0) 45%),
    radial-gradient(circle at 70% 75%, rgba(169,193,234,.55), rgba(255,255,255,0) 60%),
    rgba(214, 205, 240, .75);
  box-shadow: inset -12px -16px 30px rgba(40,20,80,.10), 0 18px 40px rgba(60,40,100,.18);
  animation: breathe 8s ease-in-out infinite;
}
.release-bubble p {
  margin: 0; font-size: .98rem; line-height: 1.45; text-align: center; overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 7; -webkit-box-orient: vertical; word-break: break-word;
}
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.release-bubble.pop { animation: pop .7s ease-out forwards; }
@keyframes pop {
  0% { transform: scale(1.05); opacity: 1; }
  40% { transform: scale(1.18); opacity: .9; }
  100% { transform: scale(1.45); opacity: 0; filter: blur(4px); }
}
.droplet {
  position: absolute; width: 12px; height: 12px; border-radius: 50%; left: 50%; top: 50%;
  background: rgba(203, 184, 238, .9); pointer-events: none;
  animation: fly .9s ease-out forwards;
}
@keyframes fly {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.2); opacity: 0; }
}
.after { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.after p { margin: 0; max-width: 38ch; }

/* Kalender */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h3 { font-size: 1.2rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-wd { text-align: center; font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .5px; padding-bottom: 4px; }
.cal-day {
  aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; font-size: .95rem; position: relative;
}
.cal-day.has { color: var(--bubble-ink); font-weight: 700; box-shadow: inset -3px -4px 8px rgba(40,20,80,.08); }
.cal-day.today { border: 2px solid var(--accent); }
.cal-day:disabled { color: var(--muted); opacity: .45; cursor: default; }
.cal-day .cnt { position: absolute; bottom: 12%; font-size: .55rem; line-height: 1; letter-spacing: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: .88rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

/* Tab-Leiste */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button {
  border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border-radius: 14px; color: var(--muted); font-size: .78rem; font-weight: 700; min-height: 52px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Dialog */
dialog {
  border: 0; padding: 0; border-radius: var(--r-lg); background: var(--surface); color: var(--ink);
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 80px rgba(20,10,50,.35);
}
dialog::backdrop { background: rgba(26, 20, 45, .45); backdrop-filter: blur(3px); }
dialog[open] { animation: sheet .3s ease-out; }
@keyframes sheet { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 40px); overflow-y: auto; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-head .chip { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--bubble-ink); }
.dlg-head .chip svg { width: 34px; height: 34px; }
.dlg-head .ttl { min-width: 0; flex: 1; }
.dlg-head .ttl p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.answer h4 { margin: 0 0 4px; font-size: .9rem; color: var(--muted); font-weight: 700; }
.answer p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.answer p.none { color: var(--muted); font-style: italic; }
.confirm { background: var(--accent-soft); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; }
.copy-area { width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.file-label { position: relative; overflow: hidden; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.lang-row { display: flex; flex-direction: column; gap: 8px; }
.lang-row .seg { flex-wrap: wrap; }
nav.tabs button span { text-align: center; line-height: 1.15; }

/* Wetter, Wasser, Bilder */
.sub-hint { margin-top: 8px; font-size: .85rem; }
.mood-opt .dot.wdot svg { width: 30px; height: 30px; }
.glasses, .moons { display: flex; gap: 4px; flex-wrap: wrap; }
.glass-btn, .moon-btn { width: 52px; height: 60px; border: 0; background: transparent; border-radius: 14px; padding: 4px; cursor: pointer; color: var(--muted); display: grid; place-items: center; transition: transform .15s, background .2s; }
.moon-btn { height: 56px; }
.glass-btn:hover, .moon-btn:hover { background: var(--accent-soft); }
.glass-btn:active, .moon-btn:active { transform: scale(.92); }
.glass-btn svg { width: 32px; height: 42px; }
.moon-btn svg { width: 34px; height: 34px; }
.water-out { margin: 6px 0 0; font-weight: 700; font-size: .95rem; min-height: 1.2em; }
.q-title { font-weight: 700; }
.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.photo-item { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--accent-soft); border: 0; padding: 0; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-item.missing img { opacity: 0; }
.photo-item .rm { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(26, 20, 45, .66); color: #fff; display: grid; place-items: center; cursor: pointer; }
.photo-thumb { cursor: zoom-in; }
.file-label svg, .btn svg { flex: none; }
.meta-row { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
.meta-chip { display: flex; align-items: center; gap: 10px; min-width: 0; }
.meta-chip .wi { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--bubble-ink); }
.meta-chip .wi svg { width: 26px; height: 26px; }
.meta-k { display: block; font-size: .8rem; color: var(--muted); font-weight: 700; }
.mini-glasses, .mini-moons { display: inline-flex; gap: 1px; color: var(--muted); }
.mini-glasses svg { width: 15px; height: 20px; }
.mini-moons svg { width: 16px; height: 16px; }
.row-icons { display: inline-flex; gap: 8px; align-items: center; vertical-align: -3px; color: var(--muted); font-weight: 400; }
.row-icons .ri { display: inline-flex; align-items: center; gap: 2px; font-size: .8rem; }
.row-icons svg { width: 17px; height: 17px; }
dialog.lb { background: transparent; box-shadow: none; width: min(96vw, 900px); max-height: 94vh; overflow: visible; padding: 0; }
dialog.lb::backdrop { background: rgba(16, 12, 28, .82); }
dialog.lb img { max-width: 100%; max-height: 86vh; display: block; margin: 0 auto; border-radius: 18px; }
.lb-x { position: absolute; top: -52px; right: 0; }

/* Frage des Tages, Morgen, Atmen */

/* Blasen-Tab v6: Filter, Monate, Physik, Himmel, Sternbild */

.bubble .bph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; opacity: .4; pointer-events: none; }

  background: conic-gradient(from 0deg, rgba(255,170,220,.45), rgba(160,215,255,.45), rgba(190,250,200,.4), rgba(255,240,160,.45), rgba(255,170,220,.45));

.sky-sun { position: absolute; right: -50px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255,232,160,.95), rgba(255,232,160,0) 70%); animation: pulse 6s ease-in-out infinite alternate; }

.wind-stage { overflow: hidden; }
.leaf { position: relative; width: min(74vw, 270px); max-width: 100%; min-height: 150px; border: 0; padding: 26px 30px; cursor: pointer; color: var(--bubble-ink);

.lantern-stage { border-radius: var(--r-lg); background: radial-gradient(120% 90% at 50% 0%, #3E3570, #191529 75%); overflow: hidden; transition: background 1s; }

@keyframes hover { from { transform: translateY(0); } to { transform: translateY(-8px); } }

    const tour = [pts[0]], rest = pts.slice(1);
    while (rest.length) { const l = tour[tour.length - 1]; let bi = 0, b = Infinity; rest.forEach((q, i) => { const d = Math.hypot(q.x - l.x, q.y - l.y); if (d < b) { b = d; bi = i; } }); tour.push(rest.splice(bi, 1)[0]); }
    const lines = tour.slice(1).map((p, i) => `<line x1="${tour[i].x.toFixed(1)}" y1="${tour[i].y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`).join("");
    const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" style="fill:rgb(${HEX[p.e.mood].join(",")})"/>`).join("");
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><g class="ml">${lines}</g>${dots}</svg>`;
  }
  function renderYear() {
    const now = new Date(), grid = $("#yearGrid");
    $("#bmTitle").textContent = String(yrY);
    const fm = firstMonth();
    const prev = $("#bmPrev"), next = $("#bmNext");
    prev.disabled = !fm || yrY <= fm[0]; next.disabled = yrY >= now.getFullYear();
    prev.style.opacity = prev.disabled ? .35 : 1; next.style.opacity = next.disabled ? .35 : 1;
    const fmtShortMonth = new Intl.DateTimeFormat(I18N[lang].locale, { month: "short" });
    let total = 0;
    grid.innerHTML = Array.from({ length: 12 }, (_, m) => {
      const key = `${yrY}-${pad(m + 1)}`;
      const list = entries.filter(e => e.date.startsWith(key)).sort((a, b) => a.date.localeCompare(b.date));
      total += list.length;
      const future = yrY > now.getFullYear() || (yrY === now.getFullYear() && m > now.getMonth());
      const label = cap(fmtMonth.format(new Date(yrY, m, 1)));
      return `<button type="button" class="year-cell${list.length ? "" : " empty"}" data-ym="${yrY}-${m}" ${future ? "disabled" : ""} aria-label="${esc(label + ": " + countText(list.length))}">
        ${miniSky(list)}<span class="ym"><strong>${esc(cap(fmtShortMonth.format(new Date(yrY, m, 1))).replace(".", ""))}</strong><small>${list.length || "·"}</small></span></button>`;
    }).join("");
    $("#fieldHint").textContent = t("year.hint", { count: countText(total) });
    $("#starToggle").hidden = true;
  }
  $("#yearGrid").addEventListener("click", ev => {

  // ---------- Abend-Erinnerung (Kalender, ohne Server) ----------
  let remTime = "21:00";
  try { const v = localStorage.getItem(REM_KEY); if (/^\d{2}:\d{2}$/.test(v)) remTime = v; } catch (e) {}
  function icsHref(time) {
    const [hh, mm] = time.split(":");
    const d = new Date(); const day = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
    const appUrl = location.href.split("#")[0];
    const lines = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gedankenblasen//Erinnerung//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VEVENT", `UID:gedankenblasen-erinnerung-${Date.now()}@gedankenblasen`, `DTSTAMP:${stamp}`,
      `DTSTART:${day}T${hh}${mm}00`, "DURATION:PT5M", "RRULE:FREQ=DAILY",
      `SUMMARY:${t("rem.summary")} 🫧`, `DESCRIPTION:${t("rem.desc")}`, `URL:${appUrl}`, "TRANSP:TRANSPARENT",
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${t("rem.summary")}`, "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"];
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.join("\r\n"));
  }

  // ---------- Navigation ----------
  const TABS = ["heute", "blasen", "loslassen", "rueckblick"];
  let current = "heute";
  function go(tab, opts = {}) {
    if (!TABS.includes(tab)) tab = "heute";

    document.querySelectorAll("nav.tabs button").forEach(b => {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "blasen") renderBlasen(opts.fresh);
    if (tab === "rueckblick") renderCal();
    if (tab === "loslassen") renderRelease();

  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

  // ---------- Check-in ----------
  function formHTML(prefix, e, withDate) {

  function readForm(prefix) {

  function renderCheckin(presetDate) {

  // ---------- Blasen: Himmel, Schubsen, Filter, Sternbild ----------
  let viewMode = "bubbles";
  let filter = null;               // { k: "mood" | "weather", v: 1–5 }
  let starMode = null;             // null = automatisch (vergangene Monate als Sternbild)
  let bmY, bmM;
  (() => { const d = new Date(); bmY = d.getFullYear(); bmM = d.getMonth(); })();
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const matches = e => !filter || (filter.k === "mood" ? e.mood === filter.v : (e.weather || 0) === filter.v);
  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
  const isCurrentMonth = () => { const d = new Date(); return bmY === d.getFullYear() && bmM === d.getMonth(); };
  function firstMonth() {
    if (!entries.length) return null;
    const min = entries.reduce((a, e) => (e.date < a ? e.date : a), entries[0].date);
    return [Number(min.slice(0, 4)), Number(min.slice(5, 7)) - 1];
  }

  $("#segBubbles").addEventListener("click", () => setMode("bubbles"));
  $("#segList").addEventListener("click", () => setMode("list"));
  $("#segYear").addEventListener("click", () => setMode("year"));
  function updateSeg() {
    $("#segBubbles").setAttribute("aria-pressed", viewMode === "bubbles");
    $("#segList").setAttribute("aria-pressed", viewMode === "list");
    $("#segYear").setAttribute("aria-pressed", viewMode === "year");
    $("#bubbleWrap").hidden = viewMode === "list";
    $("#list").hidden = viewMode !== "list";
    $("#chips").hidden = viewMode === "year";
    $("#field").hidden = viewMode === "year";
    $("#yearGrid").hidden = viewMode !== "year";
  }
  function setMode(m) {
    viewMode = m;
    updateSeg();
    try { localStorage.setItem("gedankenblasen.ansicht", m); } catch (e) {}
    renderBlasen();
  }
  $("#bmPrev").addEventListener("click", () => { if (viewMode === "year") { yrY--; renderBlasen(); return; } bmM--; if (bmM < 0) { bmM = 11; bmY--; } starMode = null; renderBlasen(); });
  $("#bmNext").addEventListener("click", () => { if (viewMode === "year") { yrY++; renderBlasen(); return; } bmM++; if (bmM > 11) { bmM = 0; bmY++; } starMode = null; renderBlasen(); });
  $("#starToggle").addEventListener("click", () => {
    const past = !isCurrentMonth();
    const nowStars = starMode === null ? past : starMode;
    starMode = !nowStars;
    renderBlasen();
  });

  // Filter
  function renderChips() {
    const c = $("#chips");
    c.setAttribute("aria-label", t("filter.aria"));
    const on = (k, v) => !!(filter && filter.k === k && filter.v === v);
    const mk = (k, v, inner, label) => `<button type="button" class="chip-f${on(k, v) ? " on" : ""}" data-fk="${k}" data-fv="${v}" aria-pressed="${on(k, v)}" aria-label="${esc(label)}" title="${esc(label)}">${inner}</button>`;
    c.innerHTML = [1, 2, 3, 4, 5].map(m => mk("mood", m, `<span class="cdot" style="background:${MOOD_COLORS[m]}">${face(m)}</span>`, moodLabel(m))).join("")
      + `<span class="chip-sep" aria-hidden="true"></span>`
      + [1, 2, 3, 4, 5].map(w => mk("weather", w, `<span class="cdot" style="background:${WEATHER_COLORS[w]}">${weatherIcon(w)}</span>`, weatherLabel(w))).join("")
      + (filter ? `<button type="button" class="chip-clear" data-fclear>${esc(t("filter.clear"))}</button>` : "");
  }
  $("#chips").addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-fclear")) filter = null;
    else {
      const k = b.dataset.fk, v = Number(b.dataset.fv);
      filter = filter && filter.k === k && filter.v === v ? null : { k, v };
    }
    renderChips();
    if (viewMode === "list") { renderList(); return; }
    $("#field").querySelectorAll("[data-id]").forEach(el => { const e = findEntry(el.dataset.id); el.classList.toggle("dim", !!(e && !matches(e))); });
    updateHint();

  });

  // Größe & Glanz: volle Tage sehen voll aus
  const textLen = e => (e.now + e.mind + e.nice + (e.dqa || "")).length;
  function bubbleSize(e, W) {
    const s = 64 + Math.sqrt(textLen(e)) * 3.1 + (e.photos || []).length * 9 + (e.weather ? 3 : 0) + (e.water ? 3 : 0);
    return Math.round(Math.max(64, Math.min(Math.min(W / 2.9, 132), s)));
  }
  const isRich = e => (e.photos || []).length > 0 || textLen(e) > 180;

  // Himmel nach Wetter
  function skyFor(list) {
    const cnt = [0, 0, 0, 0, 0, 0];
    list.forEach(e => { if (e.weather) cnt[e.weather]++; });
    let best = 0;
    for (let w = 1; w <= 5; w++) if (cnt[w] > cnt[best]) best = w;
    return best;
  }
  const CLOUD_SVG = '<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="#fff"/></svg>';
  function skyLayer(w) {
    if (!w) return "";
    const r = rng(w * 97);
    let h = "";
    if (w === 1) h += `<div class="sky-sun"></div>`;
    if (w === 2) h += `<div class="sky-sun small"></div>`;
    const clouds = { 2: 2, 3: 4, 4: 3, 5: 3 }[w] || 0;
    for (let i = 0; i < clouds; i++) h += `<div class="sky-cloud${w >= 4 ? " grey" : ""}" style="top:${(4 + r() * 40).toFixed(0)}%;width:${(90 + r() * 70).toFixed(0)}px;animation-duration:${(38 + r() * 30).toFixed(0)}s;animation-delay:-${(r() * 60).toFixed(0)}s">${CLOUD_SVG}</div>`;
    if (w >= 4) for (let i = 0; i < 26; i++) h += `<i class="drop" style="left:${(r() * 105).toFixed(1)}%;animation-duration:${(0.8 + r() * 0.6).toFixed(2)}s;animation-delay:-${(r() * 2).toFixed(2)}s"></i>`;
    if (w === 5) h += `<div class="sky-flash"></div>`;
    return `<div class="sky" aria-hidden="true">${h}</div>`;
  }

  let lastView = { items: [], stars: false, noEntries: false };
  function updateHint() {
    const el = $("#fieldHint");
    const { items, stars, noEntries } = lastView;
    let txt = "";
    if (noEntries) txt = "";
    else if (!items.length) txt = t("month.empty");
    else if (filter && !items.some(matches)) txt = t("filter.none");
    else if (stars) txt = t("stars.title", { month: cap(fmtMonth.format(new Date(bmY, bmM, 1))), count: countText(items.length) });
    else if (isCurrentMonth()) txt = t("sky.hint");
    el.textContent = txt;
  }

  function renderBlasen(freshId) {
    stopSim();
    renderChips();
    if (viewMode === "list") { renderList(); return; }
    if (viewMode === "year") { renderYear(); return; }
    if (freshId) {
      const fe = entries.find(e => e.id === freshId);
      if (fe) { bmY = Number(fe.date.slice(0, 4)); bmM = Number(fe.date.slice(5, 7)) - 1; starMode = null; }
    }
    const field = $("#field");
    const noEntries = !entries.length;
    const key = monthKey(bmY, bmM);
    $("#bmTitle").textContent = cap(fmtMonth.format(new Date(bmY, bmM, 1)));
    const fm = firstMonth();
    const prev = $("#bmPrev"), next = $("#bmNext");
    prev.disabled = noEntries || !fm || bmY < fm[0] || (bmY === fm[0] && bmM <= fm[1]);
    next.disabled = isCurrentMonth();
    prev.style.opacity = prev.disabled ? .35 : 1; next.style.opacity = next.disabled ? .35 : 1;

    const items = noEntries ? samples() : entries.filter(e => e.date.startsWith(key))
      .sort((a, b) => (a.date + (a.createdAt || "")).localeCompare(b.date + (b.createdAt || "")));
    const past = !isCurrentMonth();
    const stars = !noEntries && items.length > 0 && (starMode === null ? past : starMode);
    const W = field.clientWidth || 340;
    const H = Math.max(420, Math.min(620, 300 + items.length * 11));
    field.style.height = H + "px";
    const skyList = past ? items : items.filter(e => e.date >= offsetDate(-6));
    const w = noEntries ? 0 : skyFor(skyList);
    field.className = "field" + (stars ? " night" : w ? " sky-" + w : "");
    lastView = { items, stars, noEntries };

    if (stars) renderStars(field, items, W, H);
    else renderBubbleSim(field, items, W, H, w, freshId, noEntries);

    const tg = $("#starToggle");
    tg.hidden = !(past && items.length && !noEntries);
    tg.textContent = stars ? t("stars.toBubbles") : t("stars.toStars");
    updateHint();
  }

  function renderBubbleSim(field, items, W, H, w, freshId, noEntries) {
    const placed = [], nodes = [], sims = [];
    items.forEach(e => {
      const s = bubbleSize(e, W), r = rng(hash(e.id));
      let x, y, ok = false;
      for (let tr = 0; tr < 300 && !ok; tr++) {
        x = s / 2 + 6 + r() * Math.max(1, W - s - 12);
        y = s / 2 + 6 + r() * Math.max(1, H - s - (noEntries ? 130 : 12));
        ok = placed.every(p => Math.hypot(p.x - x, p.y - y) > (p.s + s) / 2 + 6);
      }
      placed.push({ x, y, s });
      const d = parseIso(e.date);
      const label = t(e.sample ? "aria.sample" : "aria.entry", { date: longDate(d), mood: moodLabel(e.mood) });
      const ph = (e.photos || [])[0];
      nodes.push(`<button type="button" class="bubble${e.sample ? " sample" : ""}${isRich(e) ? " rich" : ""}${matches(e) ? "" : " dim"}" data-id="${e.id}"
        style="width:${s}px;height:${s}px;--c:${MOOD_COLORS[e.mood]};transform:translate3d(${(x - s / 2).toFixed(1)}px,${(y - s / 2).toFixed(1)}px,0)"
        aria-label="${esc(label)}">${ph ? `<img class="bph" alt="" data-pid="${ph}">` : ""}${face(e.mood)}<span class="bd">${esc(e.sample ? t("sample.word") : fmtShort.format(d))}</span></button>`);
      const fresh = e.id === freshId && !reduceMotion();
      sims.push({ id: e.id, r: s / 2, x, y: fresh ? H + s : y, vx: 0, vy: fresh ? -14 : 0, ph: r() * 6.28, drag: false, entering: fresh });
    });
    field.innerHTML = skyLayer(w) + nodes.join("") + `<div class="peek" id="peek" hidden></div>`
      + (noEntries ? `<div class="field-empty"><p>${esc(t("field.empty"))}</p><button class="btn small" type="button" data-go="heute">${esc(t("field.first"))}</button></div>` : "")
      + (!noEntries && !items.length ? `<div class="field-msg">${esc(t("month.empty"))}</div>` : "");
    const els = field.querySelectorAll(".bubble");
    sims.forEach((it, i) => { it.el = els[i]; });
    fillImgs(field);
    startSim(sims, W, H);
  }

  // Sanfte Physik: schweben, schubsen, abprallen
  let sim = null;
  function startSim(items, W, H) {
    sim = { items, W, H, raf: 0, last: performance.now(), t: 0 };
    positionAll();
    if (!reduceMotion() && !document.hidden) sim.raf = requestAnimationFrame(tick);
  }
  function stopSim() { if (sim && sim.raf) cancelAnimationFrame(sim.raf); sim = null; drag = null; }
  function tick(now) {
    if (!sim) return;
    const dt = Math.min(48, now - sim.last);
    sim.last = now; sim.t += dt;
    step(dt); positionAll();
    sim.raf = requestAnimationFrame(tick);
  }
  function step(dt) {
    const f = dt / 16, { W, H } = sim, a = sim.items, damp = Math.pow(0.985, f);
    for (const it of a) {
      if (it.drag) continue;
      it.vx += Math.sin(sim.t * 0.00045 + it.ph) * 0.012 * f;
      it.vy += Math.cos(sim.t * 0.00038 + it.ph * 1.7) * 0.012 * f;
      it.vx *= damp; it.vy *= damp;
      const sp = Math.hypot(it.vx, it.vy);
      if (sp > 18) { it.vx *= 18 / sp; it.vy *= 18 / sp; }
      it.x += it.vx * f; it.y += it.vy * f;
      if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx) * 0.7; }
      if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx) * 0.7; }
      if (it.y < it.r) { it.y = it.r; it.vy = Math.abs(it.vy) * 0.7; }
      if (it.entering) { if (it.y < H - it.r) it.entering = false; }
      else if (it.y > H - it.r) { it.y = H - it.r; it.vy = -Math.abs(it.vy) * 0.7; }
    }
    for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
      const p = a[i], q = a[j];
      const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 0.01, min = p.r + q.r + 2;
      if (d >= min) continue;
      const nx = dx / d, ny = dy / d, ov = min - d;
      const pm = p.drag ? 0 : q.drag ? 1 : 0.5, qm = q.drag ? 0 : p.drag ? 1 : 0.5;
      p.x -= nx * ov * pm; p.y -= ny * ov * pm; q.x += nx * ov * qm; q.y += ny * ov * qm;
      const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rv < 0) {
        const imp = -1.75 * rv / 2;
        if (!p.drag) { p.vx -= imp * nx; p.vy -= imp * ny; }
        if (!q.drag) { q.vx += imp * nx; q.vy += imp * ny; }
      }
    }
  }
  function positionAll() {
    if (!sim) return;
    for (const it of sim.items) if (it.el) it.el.style.transform = `translate3d(${(it.x - it.r).toFixed(1)}px,${(it.y - it.r).toFixed(1)}px,0)`;
  }
  document.addEventListener("visibilitychange", () => {
    if (!sim) return;
    if (document.hidden) { if (sim.raf) cancelAnimationFrame(sim.raf); sim.raf = 0; }
    else if (!sim.raf && !reduceMotion()) { sim.last = performance.now(); sim.raf = requestAnimationFrame(tick); }
  });

  // Ziehen, Schnippen, Halten
  let drag = null, suppressUntil = 0, lpTimer = 0;
  const field = $("#field");
  field.addEventListener("pointerdown", ev => {
    const b = ev.target.closest(".bubble");
    if (!b || !sim) return;
    const it = sim.items.find(i => i.el === b);
    if (!it) return;
    const rect = field.getBoundingClientRect();
    drag = { it, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, ox: ev.clientX - rect.left - it.x, oy: ev.clientY - rect.top - it.y, moved: false, peek: false, hist: [{ x: ev.clientX, y: ev.clientY, t: performance.now() }] };
    it.drag = true; it.vx = it.vy = 0;
    try { b.setPointerCapture(ev.pointerId); } catch (e) {}
    b.classList.add("held");
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => { if (drag && !drag.moved) { drag.peek = true; showPeek(drag.it); } }, 420);
  });
  field.addEventListener("pointermove", ev => {
    if (!drag || ev.pointerId !== drag.id || !sim) return;
    if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) { drag.moved = true; clearTimeout(lpTimer); hidePeek(); }
    if (!drag.moved) return;
    const rect = field.getBoundingClientRect(), it = drag.it;
    it.x = Math.max(it.r, Math.min(sim.W - it.r, ev.clientX - rect.left - drag.ox));
    it.y = Math.max(it.r, Math.min(sim.H - it.r, ev.clientY - rect.top - drag.oy));
    const now = performance.now();
    drag.hist.push({ x: ev.clientX, y: ev.clientY, t: now });
    while (drag.hist.length > 5) drag.hist.shift();
    const h0 = drag.hist[0], dtv = Math.max(1, now - h0.t);
    it.vx = (ev.clientX - h0.x) / dtv * 16; it.vy = (ev.clientY - h0.y) / dtv * 16;
    if (!sim.raf) positionAll();
  });
  function endDrag(ev) {
    if (!drag || (ev && ev.pointerId !== drag.id)) return;
    clearTimeout(lpTimer);
    const it = drag.it;
    it.drag = false;
    if (it.el) it.el.classList.remove("held");
    if (drag.moved || drag.peek) suppressUntil = performance.now() + 400;
    if (drag.moved && reduceMotion()) { it.vx = it.vy = 0; }
    if (drag.peek) setTimeout(hidePeek, 1800);
    drag = null;
  }
  field.addEventListener("pointerup", endDrag);
  field.addEventListener("pointercancel", endDrag);
  field.addEventListener("contextmenu", ev => { if (ev.target.closest(".bubble")) ev.preventDefault(); });

  function showPeek(it) {
    const e = findEntry(it.id), p = $("#peek");
    if (!e || !p || !sim) return;
    const snippet = e.nice || e.now || e.dqa || e.mind || t("list.onlyMood");
    p.innerHTML = `<strong>${esc(e.sample ? t("sample.word") : fmtShort.format(parseIso(e.date)))} · ${esc(moodLabel(e.mood))}</strong><span>${esc(snippet)}</span>`;
    const pw = Math.min(240, sim.W - 20);
    p.style.width = pw + "px";
    p.hidden = false;
    const x = Math.max(10, Math.min(sim.W - pw - 10, it.x - pw / 2));
    let y = it.y - it.r - 10 - p.offsetHeight;
    if (y < 8) y = it.y + it.r + 10;
    p.style.transform = `translate(${x.toFixed(0)}px,${y.toFixed(0)}px)`;
    sound("soft");
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
  }
  function hidePeek() { const p = $("#peek"); if (p) p.hidden = true; }

  // Sternbild für abgeschlossene Monate
  function renderStars(field, items, W, H) {
    const pad = 34;
    const pts = [];
    items.forEach(e => {
      const r = rng(hash(e.id + "*"));
      let best = null, bestD = -1;
      for (let tr = 0; tr < 60; tr++) {
        const c = { e, x: pad + r() * (W - 2 * pad), y: pad + 26 + r() * (H - 2 * pad - 40) };
        const d = pts.length ? Math.min(...pts.map(q => Math.hypot(q.x - c.x, q.y - c.y))) : 999;
        if (d > bestD) { best = c; bestD = d; }
        if (d > 58) break;
      }
      pts.push(best);
    });
    // wie ein echtes Sternbild: immer zum nächsten noch freien Nachbarn
    const tour = pts.length ? [pts[0]] : [], rest = pts.slice(1);
    while (rest.length) {
      const last = tour[tour.length - 1];
      let bi = 0, bd = Infinity;
      rest.forEach((q, i) => { const d = Math.hypot(q.x - last.x, q.y - last.y); if (d < bd) { bd = d; bi = i; } });
      tour.push(rest.splice(bi, 1)[0]);
    }
    const lines = tour.slice(1).map((p, i) => `<line pathLength="1" style="animation-delay:${(i * 0.12).toFixed(2)}s" x1="${tour[i].x.toFixed(1)}" y1="${tour[i].y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`).join("");
    const r0 = rng(hash(monthKey(bmY, bmM)));
    let bg = "";
    for (let i = 0; i < 60; i++) bg += `<circle cx="${(r0() * W).toFixed(0)}" cy="${(r0() * H).toFixed(0)}" r="${(0.4 + r0() * 1.1).toFixed(2)}" opacity="${(0.25 + r0() * 0.5).toFixed(2)}"/>`;
    const stars = pts.map(p => {
      const e = p.e, s = Math.round(16 + Math.min(16, (bubbleSize(e, W) - 64) / 3));
      return `<button type="button" class="star${matches(e) ? "" : " dim"}" data-id="${e.id}" style="left:${(p.x - s / 2).toFixed(1)}px;top:${(p.y - s / 2).toFixed(1)}px;width:${s}px;height:${s}px;--c:${MOOD_COLORS[e.mood]};animation-delay:-${(r0() * 3).toFixed(2)}s" aria-label="${esc(t("aria.entry", { date: longDate(parseIso(e.date)), mood: moodLabel(e.mood) }))}"><span class="sd" aria-hidden="true">${parseIso(e.date).getDate()}</span></button>`;
    }).join("");
    field.innerHTML = `<svg class="star-lines" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><g class="bgs">${bg}</g><g class="sl">${lines}</g></svg>${stars}<div class="star-title">${esc(cap(fmtMonth.format(new Date(bmY, bmM, 1))))}</div>`;
  }

      `<button type="button" class="photo-item photo-thumb" data-photo="${id}" aria-label="${esc(t("photos.open"))}"><img alt="${esc(alt)}" data-pid="${id}"></button>`).join("")}</div></div>` : "";
    openDlg(`
      <div class="dlg-head">

        ${closeBtn()}
      </div>

      ${intentFor(e.date) ? `<div class="answer"><h4>${esc(t("intent.title"))}</h4><p>${esc(quote(intentFor(e.date)))}</p></div>` : ""}
      ${answers}

          bubble: `<div class="release-stage" id="relStage"><button type="button" class="release-bubble" id="relObj" aria-label="${esc(t("los.pop"))}"><p></p></button></div>`,
          wind: `<div class="release-stage wind-stage" id="relStage"><i class="gust g1"></i><i class="gust g2"></i><i class="gust g3"></i><button type="button" class="leaf" id="relObj" aria-label="${esc(t("los.blow"))}"><p></p></button></div>`,
          lantern: `<div class="release-stage lantern-stage" id="relStage"><i class="tiny-star s1"></i><i class="tiny-star s2"></i><i class="tiny-star s3"></i><button type="button" class="lantern" id="relObj" aria-label="${esc(t("los.lift"))}"><span class="flame"></span><p></p></button></div>`,
        }[ritual];
        const hint = { bubble: "los.breath", wind: "los.breathWind", lantern: "los.breathLantern" }[ritual];
        const label = { bubble: "los.pop", wind: "los.blow", lantern: "los.lift" }[ritual];
        card.innerHTML = `${stage}
          <div class="after">
            <p class="hint">${esc(t(hint))}</p>
            <button class="btn" type="button" id="relPop">${esc(t(label))}</button>
          </div>`;
        $("#relObj p").textContent = text;
        $("#relObj").addEventListener("click", releaseIt);
        $("#relPop").addEventListener("click", releaseIt);
      });
    } else if (releaseState === "done") {
      const title = { bubble: "los.done", wind: "los.doneWind", lantern: "los.doneLantern" }[doneRitual];
      card.innerHTML = `
        <div class="after" style="padding:24px 0">
          <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="6" fill="var(--m2)"/><circle cx="16" cy="22" r="3.5" fill="var(--m1)"/><circle cx="56" cy="20" r="3" fill="var(--m4)"/><circle cx="58" cy="52" r="4" fill="var(--m3)"/><circle cx="14" cy="54" r="2.5" fill="var(--m5)"/></svg>
          <h3 tabindex="-1" id="relDone">${esc(t(title))}</h3>
          <p>${esc(t("los.doneText"))}</p>
          <button class="btn ghost" type="button" id="relAgain">${esc(t("los.again"))}</button>
        </div>`;
      $("#relAgain").addEventListener("click", () => { releaseState = "write"; renderRelease(); $("#relText").focus(); });
    }
  }
  function releaseIt() {
    const obj = $("#relObj");
    if (!obj || obj.classList.contains("gone")) return;
    const stage = $("#relStage");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    obj.classList.add("gone");
    $("#relPop").disabled = true;
    let wait = reduce ? 550 : 950;
    if (doneRitual === "bubble") {
      obj.classList.add("pop"); sound("pop");
      if (!reduce) for (let i = 0; i < 14; i++) {
        const s = document.createElement("span"); s.className = "droplet";
        const a = (i / 14) * Math.PI * 2 + Math.random() * .3, dist = 120 + Math.random() * 60;
        s.style.setProperty("--tx", Math.cos(a) * dist + "px"); s.style.setProperty("--ty", Math.sin(a) * dist + "px");
        s.style.background = MOOD_COLORS[(i % 5) + 1];
        const sz = 6 + Math.random() * 10; s.style.width = s.style.height = sz + "px";
        stage.appendChild(s);
      }
    } else if (doneRitual === "wind") {
      stage.classList.add("blowing"); obj.classList.add("away"); whoosh();
      wait = reduce ? 550 : 1500;
    } else {
      stage.classList.add("rising"); obj.classList.add("rise"); sound("soft");
      setTimeout(() => sound("breath"), 1800);
      wait = reduce ? 550 : 3300;
    }
    setTimeout(() => { releaseState = "done"; renderRelease(); const h = $("#relDone"); if (h) h.focus(); }, wait);
  }

  // ---------- Rückblick ----------
  let calY, calM;
  (() => { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); })();
  $("#calPrev").addEventListener("click", () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); });
  $("#calNext").addEventListener("click", () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); });

  function byDay() {
    const m = new Map();
    entries.forEach(e => { if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); });
    return m;
  }
  function renderCal() {
    const now = new Date();
    $("#calTitle").textContent = cap(fmtMonth.format(new Date(calY, calM, 1)));
    $("#calNext").disabled = calY > now.getFullYear() || (calY === now.getFullYear() && calM >= now.getMonth());
    $("#calNext").style.opacity = $("#calNext").disabled ? .35 : 1;
    const days = byDay();
    const first = new Date(calY, calM, 1);
    const offset = (first.getDay() + 6) % 7;
    const count = new Date(calY, calM + 1, 0).getDate();
    const td = todayIso();
    // Wochentage ab Montag (5. Jan. 2026 ist ein Montag)
    let html = [0, 1, 2, 3, 4, 5, 6].map(i => `<div class="cal-wd" aria-hidden="true">${esc(cap(fmtWd.format(new Date(2026, 0, 5 + i)).replace(".", "")).slice(0, 3))}</div>`).join("");
    for (let i = 0; i < offset; i++) html += `<div></div>`;
    for (let d = 1; d <= count; d++) {
      const key = `${calY}-${pad(calM + 1)}-${pad(d)}`;
      const list = days.get(key) || [];
      const future = key > td;
      let style = "", cls = "cal-day", label;
      const long = longDate(new Date(calY, calM, d));
      if (list.length) {
        const avg = Math.round(list.reduce((s, e) => s + e.mood, 0) / list.length);
        style = `background:${MOOD_COLORS[avg]}`;
        cls += " has";
        label = t("rb.has", { date: long, count: countText(list.length), mood: moodLabel(avg) });
      } else label = future ? long : t("rb.none", { date: long });
      if (key === td) cls += " today";
      html += `<button type="button" class="${cls}" style="${style}" data-date="${key}" ${future ? "disabled" : ""} aria-label="${esc(label)}">${d}${list.length > 1 ? `<span class="cnt" aria-hidden="true">${"•".repeat(Math.min(list.length, 3))}</span>` : ""}</button>`;
    }
    $("#calGrid").innerHTML = html;
    renderSummary();
    renderCorr();
    renderJar();
  }
  $("#calGrid").addEventListener("click", ev => {
    const b = ev.target.closest(".cal-day");
    if (b && !b.disabled) openDay(b.dataset.date);
  });
  function openDay(date) {
    const list = sorted(entries.filter(e => e.date === date));
    const long = longDate(parseIso(date));
    if (!list.length) {
      openDlg(`
        <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(long)}</h3><p>${esc(t("day.none"))}</p></div>${closeBtn()}</div>
        <p style="margin:0">${esc(t("day.ask"))}</p>
        <div class="row"><button class="btn small" type="button" data-writeday="${date}">${esc(t("day.write"))}</button></div>`);
      return;
    }
    if (list.length === 1) { openEntry(list[0].id); return; }
    openDlg(`
      <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(long)}</h3><p>${esc(countText(list.length))}</p></div>${closeBtn()}</div>
      <div class="list-items">${list.map(e => rowHTML(e, date)).join("")}</div>`);
  }

  // ---------- Info, Sicherung & Sprache ----------
  let downloads = null;
  (async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); } catch (e) {} })();
  const inArtifact = !!(window.claude && window.claude.use);

  function backupName() { return `${t("backup.file")}-${todayIso()}.json`; }
  function backupData() { return JSON.stringify({ app: "Gedankenblasen", version: 3, exportiert: new Date().toISOString(), eintraege: sorted(entries), schlaf: sleepMap, absichten: intentMap }, null, 2); }
  function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
  function dataURLToBlob(d) {
    const comma = d.indexOf(",");
    const mime = (d.slice(0, comma).match(/data:([^;]+)/) || [])[1] || "image/jpeg";
    const bin = atob(d.slice(comma + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  async function buildBackup() {
    const fotos = {};
    for (const e of entries) for (const id of (e.photos || [])) {
      if (fotos[id]) continue;
      try { const blob = await PhotoDB.get(id); if (blob) fotos[id] = await blobToDataURL(blob); } catch (err) {}
    }
    return JSON.stringify({ app: "Gedankenblasen", version: 3, exportiert: new Date().toISOString(), eintraege: sorted(entries), schlaf: sleepMap, absichten: intentMap, fotos }, null, 2);
  }
  let backupReady = null;

  function openInfo() {
    backupReady = null;
    buildBackup().then(d => { backupReady = d; const b = $("#expBtn"); if (b && entries.length) b.disabled = false; });
    const langBtns = LANGS.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}" lang="${l}">${I18N[l].name}</button>`).join("");
    openDlg(`
      <div class="dlg-head"><div class="ttl"><h3 id="dlgTitle">${esc(t("info.title"))}</h3><p>${esc(t("info.count", { count: countText(entries.length) }))}</p></div>${closeBtn()}</div>
      <div class="settings">
        <h4>${esc(t("settings.title"))}</h4>
        <div class="lang-row"><span class="hint" id="langLbl">${esc(t("info.lang"))} · Sprache · Language · Langue</span>
          <div class="seg" role="group" aria-labelledby="langLbl">${langBtns}</div></div>
        <div class="lang-row"><span class="hint" id="themeLbl">${esc(t("theme.label"))}</span>
          <div class="seg" role="group" aria-labelledby="themeLbl">${["auto", "light", "dark"].map(k => `<button type="button" data-theme-set="${k}" aria-pressed="${theme === k}">${esc(t("theme." + k))}</button>`).join("")}</div></div>
        <label class="switch" for="soundToggle">
          <input type="checkbox" id="soundToggle" role="switch" ${soundOn ? "checked" : ""}>
          <span class="track" aria-hidden="true"></span>
          <span><strong>${esc(t("sound.label"))}</strong><br><span class="hint">${esc(t("sound.hint"))}</span></span>
        </label>
        <div class="rem">
          <strong>${esc(t("rem.title"))}</strong>
          <span class="hint">${esc(t("rem.hint"))}</span>
          <div class="row rem-row"><label class="sr-only" for="remTime">${esc(t("rem.time"))}</label><input type="time" id="remTime" value="${remTime}">
            <a class="btn ghost small" id="remLink" href="${icsHref(remTime)}" download="gedankenblasen-erinnerung.ics">${esc(t("rem.add"))}</a></div>
        </div>
        <div class="prem-row"><span><strong>${esc(t("prem.status"))}</strong> · <span class="hint">${esc(t(premium ? "prem.on" : "prem.off"))}</span></span>
          <button class="btn ghost small" type="button" data-premium-open>${esc(t("prem.more"))}</button></div>
        <div class="row"><button class="btn ghost small" type="button" data-tour>${esc(t("info.tour"))}</button>
          <button class="btn ghost small" type="button" data-privacy>${esc(t("priv.open"))}</button>
          <button class="btn ghost small" type="button" data-feedback>${esc(t("fb.open"))}</button></div>
      </div>
      ${storageOk ? "" : `<div class="confirm"><p>${esc(t("info.warn"))}</p></div>`}
      <p style="margin:0">${esc(t("info.p1"))}</p>
      <p style="margin:0">${esc(t("info.p2"))}</p>
      <p style="margin:0">${esc(t("info.p3"))}</p>
      <div class="row">
        <button class="btn small" type="button" id="expBtn" ${entries.length && backupReady ? "" : "disabled"}>${esc(t("info.export"))}</button>
        <button class="btn ghost small" type="button" id="copyBtn" ${entries.length ? "" : "disabled"}>${esc(t("info.copy"))}</button>
        <label class="btn ghost small file-label">${esc(t("info.import"))}<input type="file" id="impFile" accept=".json,application/json"></label>
      </div>
      <div id="copyWrap" hidden>
        <label for="copyArea" class="hint">${esc(t("info.copyLabel"))}</label>
        <textarea id="copyArea" class="copy-area" readonly></textarea>
      </div>
      <p class="hint">${esc(t("info.importHint"))}</p>
      <p class="hint" style="margin:0">Gedankenblasen · Version ${APP_VERSION}</p>`);
    $("#remTime").addEventListener("change", ev => {
      if (/^\d{2}:\d{2}$/.test(ev.target.value)) { remTime = ev.target.value; try { localStorage.setItem(REM_KEY, remTime); } catch (e) {} $("#remLink").href = icsHref(remTime); }
    });
    $("#soundToggle").addEventListener("change", ev => {
      soundOn = ev.target.checked;
      try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
      sound("pop");
    });
    $("#expBtn").addEventListener("click", exportBackup);
    $("#copyBtn").addEventListener("click", copyBackup);
    $("#impFile").addEventListener("change", importBackup);
  }
  async function exportBackup() {
    const data = backupReady || backupData();
    if (downloads) {
      try { await downloads.save({ filename: backupName(), data }); toast(t("toast.backupSaved")); }
      catch (e) {
        if (e && e.code === "declined") toast(t("toast.backupCancel"));
        else { toast(t("toast.noDownload")); showCopy(data); }
      }
      return;
    }
    if (inArtifact) { showCopy(data); toast(t("toast.noDownload")); return; }
    try {
      const file = new File([data], backupName(), { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Gedankenblasen" });
        toast(t("toast.shared"));
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") { toast(t("toast.backupCancel")); return; } }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t("toast.downloaded"));
    } catch (e) { showCopy(data); }
  }
  function showCopy(data) {
    $("#copyWrap").hidden = false;
    const ta = $("#copyArea"); ta.value = data; ta.focus(); ta.select();
  }
  function copyBackup() {
    const data = backupData();
    const fallback = () => { showCopy(data); toast(t("toast.marked")); };
    try {
      navigator.clipboard.writeText(data).then(() => toast(t("toast.copied")), fallback);
    } catch (e) { fallback(); }
  }
  function importBackup(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(reader.result);
        const arr = Array.isArray(parsed) ? parsed : parsed.eintraege;
        if (!Array.isArray(arr)) throw new Error();
        const fotos = parsed && typeof parsed.fotos === "object" && parsed.fotos ? parsed.fotos : {};
        const valid = arr.filter(validEntry).map(e => ({
          id: e.id, date: e.date, mood: e.mood,
          weather: Number.isInteger(e.weather) && e.weather >= 1 && e.weather <= 5 ? e.weather : 0,
          water: typeof e.water === "number" && e.water >= 0 && e.water <= 5 ? Math.round(e.water * 2) / 2 : 0,
          photos: Array.isArray(e.photos) ? e.photos.filter(p => typeof p === "string" && /^p[a-z0-9]+$/i.test(p)).slice(0, MAX_PHOTOS) : [],
          now: String(e.now || ""), mind: String(e.mind || ""), nice: String(e.nice || ""),
          dq: Number.isInteger(e.dq) && e.dq >= 0 && e.dq < DQ_COUNT ? e.dq : dqIndex(e.date), dqa: String(e.dqa || ""),
          createdAt: e.createdAt || new Date().toISOString(), updatedAt: e.updatedAt || e.createdAt || new Date().toISOString(),
        }));
        if (parsed && parsed.schlaf && typeof parsed.schlaf === "object") {
          for (const [d, v] of Object.entries(parsed.schlaf)) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(d) && Number.isInteger(v) && v >= 1 && v <= 5 && !sleepFor(d)) sleepMap[d] = v;
          }
          saveSleep();
        }
        if (parsed && parsed.absichten && typeof parsed.absichten === "object") {
          for (const [d, v] of Object.entries(parsed.absichten)) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(d) && typeof v === "string" && v.trim() && !intentFor(d)) intentMap[d] = v.slice(0, 140);
          }
          saveIntents();
        }
        const ids = new Set(entries.map(e => e.id));
        const added = valid.filter(e => !ids.has(e.id));
        for (const e of added) {
          const kept = [];
          for (const id of e.photos) {
            const d = fotos[id];
            if (typeof d === "string" && d.startsWith("data:image/")) {
              try { await PhotoDB.put(id, dataURLToBlob(d)); kept.push(id); } catch (err) {}
            }
          }
          e.photos = kept;
        }
        entries = entries.concat(added);
        persist(); refresh();
        toast(added.length ? t("toast.imported", { count: countText(added.length) }) : t("toast.importNone"));
        openInfo();
      } catch (e) { toast(t("toast.importError")); }
    };
    reader.readAsText(file);
  }
  $("#infoBtn").addEventListener("click", openInfo);
  document.addEventListener("click", ev => { if (ev.target.closest("[data-open-info]")) openInfo(); });

  // Hinweis beim ersten Start
  let noteSeen = false;
  try { noteSeen = localStorage.getItem(NOTE_KEY) === "1"; } catch (e) {}
  $("#storageNote").hidden = noteSeen;
  $("#noteClose").addEventListener("click", () => { $("#storageNote").hidden = true; try { localStorage.setItem(NOTE_KEY, "1"); } catch (e) {} });

  // ---------- Toast ----------
  let toastT;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.hidden = true; }, 3600);
  }

  // ---------- Start ----------
  makeFormatters();
  applyStatic();
  try { const m = localStorage.getItem("gedankenblasen.ansicht"); if (m === "list" || m === "year") viewMode = m; } catch (e) {}
  updateSeg();
  renderCheckin();
  renderMorning();
  renderMemory();
  renderIntentNote();
  const hash0 = (location.hash || "").replace("#", "");
  go(TABS.includes(hash0) ? hash0 : "heute");
  let tourSeen = true;
  try { tourSeen = localStorage.getItem(TOUR_KEY) === "1"; } catch (e) {}
  if (!tourSeen && !entries.length) openTour();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}); });
}
</script>
</body>
